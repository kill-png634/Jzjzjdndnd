name: Web Desktop with Selkies & Cloudflare Tunnel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    env:
      DESKTOP_USER: desktop
      DESKTOP_PASSWORD: ${{ secrets.SELKIES_PASSWORD }}

    steps:
      - name: Validate required secret
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${DESKTOP_PASSWORD}" ]; then
            echo "::error::Secret SELKIES_PASSWORD is missing."
            echo "Create it at: Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Create Selkies XFCE image files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p root/defaults

          cat > Dockerfile <<'EOF'
          FROM ghcr.io/linuxserver/baseimage-selkies:debiantrixie

          USER root

          RUN apt-get update && \
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                xfce4 \
                xfce4-goodies \
                dbus-x11 \
                xdg-utils \
                firefox-esr \
                xterm \
                fonts-dejavu-core \
                ca-certificates && \
              apt-get clean && \
              rm -rf /var/lib/apt/lists/*

          COPY root/ /
          RUN chmod +x /defaults/startwm.sh /usr/local/bin/browser-fallback
          EOF

          cat > root/defaults/startwm.sh <<'EOF'
          #!/usr/bin/env bash
          set -e

          mkdir -p /config/.config/autostart

          cat > /config/.config/autostart/browser.desktop <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=Web Browser
          Exec=/usr/local/bin/browser-fallback https://www.google.com
          Terminal=false
          X-GNOME-Autostart-enabled=true
          DESKTOP

          exec dbus-launch --exit-with-session startxfce4
          EOF

          mkdir -p root/usr/local/bin

          cat > root/usr/local/bin/browser-fallback <<'EOF'
          #!/usr/bin/env bash
          set -e

          URL="${1:-https://www.google.com}"

          for browser in firefox-esr firefox epiphany-browser chromium chromium-browser google-chrome; do
            if command -v "$browser" >/dev/null 2>&1; then
              exec "$browser" "$URL"
            fi
          done

          echo "No supported browser was found." >&2
          exit 1
          EOF

      - name: Build Selkies XFCE image
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull --tag selkies-xfce:local .

      - name: Start Selkies desktop
        shell: bash
        run: |
          set -euo pipefail

          docker run -d \
            --name selkies-desktop \
            --shm-size=2gb \
            -p 127.0.0.1:3000:3000 \
            -e CUSTOM_USER="${DESKTOP_USER}" \
            -e PASSWORD="${DESKTOP_PASSWORD}" \
            -e TITLE="GitHub Selkies Desktop" \
            -e SELKIES_USE_CPU="true|locked" \
            -e SELKIES_ENCODER="x264enc,jpeg" \
            -e SELKIES_FRAMERATE="60" \
            -e SELKIES_MANUAL_WIDTH="1280" \
            -e SELKIES_MANUAL_HEIGHT="720" \
            -e SELKIES_AUDIO_ENABLED="true" \
            -e SELKIES_MICROPHONE_ENABLED="false|locked" \
            -e SELKIES_AUDIO_BITRATE="160000" \
            -e SELKIES_UI_TITLE="GitHub Desktop" \
            -e SELKIES_UI_SIDEBAR_SHOW_FULLSCREEN="true" \
            -e SELKIES_UI_SIDEBAR_SHOW_AUDIO_SETTINGS="true" \
            -v selkies-config:/config \
            selkies-xfce:local

      - name: Local Selkies readiness and HTTP tests
        shell: bash
        run: |
          set -euo pipefail

          echo "Waiting for Selkies HTTP service..."

          OK=0
          for i in $(seq 1 90); do
            if curl --fail --silent --show-error \
              --user "${DESKTOP_USER}:${DESKTOP_PASSWORD}" \
              --max-time 10 \
              http://127.0.0.1:3000/ \
              -o /tmp/selkies.html; then
              OK=1
              break
            fi

            if ! docker ps --format '{{.Names}}' | grep -qx 'selkies-desktop'; then
              echo "::error::Selkies container stopped unexpectedly."
              docker logs selkies-desktop || true
              exit 1
            fi

            sleep 2
          done

          if [ "${OK}" -ne 1 ]; then
            echo "::error::Selkies HTTP service never responded successfully."
            docker logs --tail 200 selkies-desktop || true
            exit 1
          fi

          test -s /tmp/selkies.html

          # The new Selkies web client is a Vue/React SPA whose initial HTML
          # is a shell (no literal "selkies" word). Detect the SPA markers
          # instead of grepping for the product name.
          if grep -qE 'id="app"|manifest\.json|apple-touch-icon|assets/index-.*\.js' /tmp/selkies.html; then
            echo "Local Selkies HTTP test passed (SPA shell detected)."
          else
            echo "::error::The service replied, but the page does not look like the Selkies web client."
            echo "--- first 80 lines of response ---"
            head -n 80 /tmp/selkies.html || true
            exit 1
          fi

      - name: Install cloudflared
        shell: bash
        run: |
          set -euo pipefail

          sudo curl --fail --location --retry 3 \
            --output /usr/local/bin/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64

          sudo chmod +x /usr/local/bin/cloudflared
          cloudflared --version

      - name: Start Cloudflare tunnel
        shell: bash
        run: |
          set -euo pipefail

          nohup cloudflared tunnel \
            --url http://127.0.0.1:3000 \
            --protocol http2 \
            --no-autoupdate \
            --loglevel info \
            --logfile /tmp/cloudflared.log \
            >/tmp/cloudflared.stdout 2>&1 &

          PUBLIC_URL=""

          for i in $(seq 1 90); do
            PUBLIC_URL="$(
              grep -hEo 'https://[-a-z0-9]+\.trycloudflare\.com' \
                /tmp/cloudflared.log /tmp/cloudflared.stdout 2>/dev/null \
                | head -n 1 || true
            )"

            if [ -n "${PUBLIC_URL}" ]; then
              break
            fi

            sleep 2
          done

          if [ -z "${PUBLIC_URL}" ]; then
            echo "::error::Cloudflare Quick Tunnel did not return a public URL."
            echo "--- cloudflared log ---"
            cat /tmp/cloudflared.log || true
            echo "--- cloudflared stdout ---"
            cat /tmp/cloudflared.stdout || true
            exit 1
          fi

          echo "PUBLIC_URL=${PUBLIC_URL}" >> "${GITHUB_ENV}"

      - name: Public tunnel end-to-end test
        shell: bash
        run: |
          set -euo pipefail

          echo "Testing the public Cloudflare URL..."

          OK=0
          for i in $(seq 1 30); do
            if curl --fail --silent --show-error \
              --location \
              --user "${DESKTOP_USER}:${DESKTOP_PASSWORD}" \
              --max-time 20 \
              "${PUBLIC_URL}" \
              -o /tmp/public-selkies.html; then
              OK=1
              break
            fi
            sleep 2
          done

          if [ "${OK}" -ne 1 ]; then
            echo "::error::Public Cloudflare URL never responded successfully."
            exit 1
          fi

          test -s /tmp/public-selkies.html

          if grep -qE 'id="app"|manifest\.json|apple-touch-icon|assets/index-.*\.js' /tmp/public-selkies.html; then
            echo "Public Cloudflare tunnel HTTP test passed (SPA shell detected)."
          else
            echo "::error::Public URL responded but did not serve the Selkies web client."
            head -n 80 /tmp/public-selkies.html || true
            exit 1
          fi

      - name: Publish desktop link
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "## ✅ Selkies Desktop is ready"
            echo
            echo "- **Desktop URL:** ${PUBLIC_URL}"
            echo "- **Username:** \`${DESKTOP_USER}\`"
            echo "- **Password:** value of the \`SELKIES_PASSWORD\` Actions secret"
            echo "- **Resolution:** 1280×720"
            echo "- **Encoder:** CPU / x264"
            echo
            echo "> The link works only while this GitHub Actions job remains running."
          } >> "${GITHUB_STEP_SUMMARY}"

          echo "Desktop URL: ${PUBLIC_URL}"
          echo "Username: ${DESKTOP_USER}"
          echo "Password: use the SELKIES_PASSWORD secret value."

      - name: Keep desktop alive
        shell: bash
        run: |
          set -euo pipefail

          while true; do
            if ! docker ps --format '{{.Names}}' | grep -qx 'selkies-desktop'; then
              echo "::error::Selkies container stopped."
              docker logs selkies-desktop || true
              exit 1
            fi

            sleep 60
          done
