name: KasmVNC Web Desktop

on:
  workflow_dispatch:

jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      VNC_USER: desktop
      VNC_PASSWORD: KasmVNC123!
      VNC_DISPLAY: ":1"
      VNC_PORT: "8444"
      VNC_GEOMETRY: "1280x800"

    steps:

      # ============================================================
      # 1. Install XFCE and dependencies
      # ============================================================
      - name: Install XFCE and dependencies
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " Installing XFCE and dependencies"
          echo "=========================================="

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 \
            xfce4-goodies \
            dbus-x11 \
            x11-xserver-utils \
            xdg-utils \
            curl \
            wget \
            jq \
            iproute2 \
            net-tools \
            ca-certificates \
            gnupg \
            openssl \
            sudo \
            pulseaudio \
            pulseaudio-utils \
            gstreamer1.0-tools \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-pulseaudio \
            epiphany-browser \
            fonts-dejavu-core

          echo "XFCE installation complete."

      # ============================================================
      # 2. Install KasmVNC
      # ============================================================
      - name: Install KasmVNC
        run: |
          set -euo pipefail

          KASMVNC_VERSION="1.5.0"
          KASMVNC_DEB="/tmp/kasmvnc.deb"

          echo "=========================================="
          echo " Installing KasmVNC ${KASMVNC_VERSION}"
          echo "=========================================="

          echo "Architecture: $(dpkg --print-architecture)"

          DOWNLOAD_URL="https://github.com/kasmtech/KasmVNC/releases/download/v${KASMVNC_VERSION}/kasmvncserver_noble_${KASMVNC_VERSION}_amd64.deb"

          echo "Downloading:"
          echo "$DOWNLOAD_URL"

          curl \
            -L \
            --fail \
            --retry 5 \
            --retry-delay 3 \
            --connect-timeout 30 \
            --max-time 300 \
            -o "$KASMVNC_DEB" \
            "$DOWNLOAD_URL"

          echo "Downloaded package:"
          ls -lh "$KASMVNC_DEB"

          echo "Installing package..."

          sudo apt-get install -y "$KASMVNC_DEB"

          echo ""
          echo "===== KasmVNC binaries ====="

          command -v vncserver || true
          command -v Xvnc || true

          echo ""
          echo "===== KasmVNC version ====="

          vncserver --version || true

          echo ""
          echo "KasmVNC installation complete."

      # ============================================================
      # 3. Create desktop user
      # ============================================================
      - name: Create desktop user
        run: |
          set -euo pipefail

          echo "Creating desktop user..."

          if ! id "$VNC_USER" >/dev/null 2>&1; then
            sudo useradd \
              --create-home \
              --shell /bin/bash \
              "$VNC_USER"
          fi

          echo "${VNC_USER}:${VNC_PASSWORD}" | sudo chpasswd

          sudo usermod -aG audio "$VNC_USER" || true
          sudo usermod -aG video "$VNC_USER" || true

          echo "User:"
          id "$VNC_USER"

      # ============================================================
      # 4. Configure VNC password
      # ============================================================
      - name: Configure VNC password
        run: |
          set -euo pipefail

          HOME_DIR="/home/$VNC_USER"

          sudo -u "$VNC_USER" mkdir -p "$HOME_DIR/.vnc"

          echo "Creating VNC password file..."

          sudo -u "$VNC_USER" bash -c \
            "printf '%s\n' '$VNC_PASSWORD' | vncpasswd -f > '$HOME_DIR/.vnc/passwd'"

          sudo chmod 600 "$HOME_DIR/.vnc/passwd"

          sudo chown \
            "$VNC_USER:$VNC_USER" \
            "$HOME_DIR/.vnc/passwd"

          echo "Password configured."

      # ============================================================
      # 5. Configure XFCE startup
      # ============================================================
      - name: Configure XFCE
        run: |
          set -euo pipefail

          HOME_DIR="/home/$VNC_USER"

          sudo -u "$VNC_USER" mkdir -p "$HOME_DIR/.vnc"

          sudo -u "$VNC_USER" tee "$HOME_DIR/.vnc/xstartup" > /dev/null <<'EOF'
          #!/bin/bash

          unset SESSION_MANAGER
          unset DBUS_SESSION_BUS_ADDRESS

          export XDG_CURRENT_DESKTOP=XFCE
          export XDG_SESSION_DESKTOP=xfce
          export XDG_CONFIG_DIRS=/etc/xdg/xdg-xfce:/etc/xdg
          export XDG_DATA_DIRS=/usr/share/xfce4:/usr/local/share:/usr/share

          if command -v dbus-launch >/dev/null 2>&1; then
              eval "$(dbus-launch --sh-syntax --exit-with-session)"
          fi

          xfconf-query \
            -c xfwm4 \
            -p /general/use_compositing \
            -s false \
            2>/dev/null || true

          exec startxfce4
          EOF

          sudo chmod +x "$HOME_DIR/.vnc/xstartup"

          sudo chown \
            "$VNC_USER:$VNC_USER" \
            "$HOME_DIR/.vnc/xstartup"

          echo "XFCE startup configured."

      # ============================================================
      # 6. Start PulseAudio
      # ============================================================
      - name: Start PulseAudio
        run: |
          set -euo pipefail

          HOME_DIR="/home/$VNC_USER"

          sudo -u "$VNC_USER" bash <<'EOF'
          export HOME="/home/desktop"
          export XDG_RUNTIME_DIR="/tmp/runtime-desktop"

          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"

          pulseaudio \
            --start \
            --exit-idle-time=-1 \
            --daemonize=true \
            || true

          sleep 2

          pactl info || true
          EOF

          echo "PulseAudio started."

      # ============================================================
      # 7. Start KasmVNC
      # ============================================================
      - name: Start KasmVNC
        run: |
          set -euo pipefail

          HOME_DIR="/home/$VNC_USER"

          echo "=========================================="
          echo " Starting KasmVNC"
          echo "=========================================="

          sudo -u "$VNC_USER" bash <<EOF
          export HOME="$HOME_DIR"
          export USER="$VNC_USER"
          export DISPLAY="$VNC_DISPLAY"
          export XDG_RUNTIME_DIR="/tmp/runtime-$VNC_USER"

          mkdir -p "\$XDG_RUNTIME_DIR"
          chmod 700 "\$XDG_RUNTIME_DIR"

          rm -f "\$HOME/.vnc/"*.pid 2>/dev/null || true
          rm -f "\$HOME/.vnc/"*.log 2>/dev/null || true

          echo "Starting display $VNC_DISPLAY..."

          vncserver "$VNC_DISPLAY" \
            -geometry "$VNC_GEOMETRY" \
            -depth 24 \
            -localhost \
            -rfbport "$VNC_PORT" \
            -PasswordFile "\$HOME/.vnc/passwd"

          EOF

          sleep 5

          echo ""
          echo "===== Processes ====="

          ps aux | grep -E \
            'Xvnc|kasmvnc|vncserver' \
            | grep -v grep || true

          echo ""
          echo "===== Ports ====="

          ss -lntp || true

          echo ""
          echo "===== Sessions ====="

          sudo -u "$VNC_USER" vncserver -list || true

      # ============================================================
      # 8. Find KasmVNC web port
      # ============================================================
      - name: Verify KasmVNC
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " Checking KasmVNC"
          echo "=========================================="

          READY=0

          for i in $(seq 1 60); do

            echo "Check $i/60..."

            if ss -lnt | grep -q ":${VNC_PORT} "; then
              echo "Port ${VNC_PORT} is listening."
              READY=1
              break
            fi

            sleep 2

          done

          echo ""
          echo "===== Listening ports ====="
          ss -lntp || true

          echo ""
          echo "===== VNC processes ====="

          ps aux | grep -E \
            'Xvnc|kasmvnc|vncserver' \
            | grep -v grep || true

          echo ""
          echo "===== KasmVNC logs ====="

          find "/home/$VNC_USER/.vnc" \
            -maxdepth 1 \
            -type f \
            -name "*.log" \
            -print \
            -exec tail -n 100 {} \; \
            || true

          if [ "$READY" -ne 1 ]; then
            echo ""
            echo "=========================================="
            echo " KASMVNC DID NOT OPEN PORT ${VNC_PORT}"
            echo "=========================================="
            exit 1
          fi

          echo ""
          echo "KasmVNC port is ready."

      # ============================================================
      # 9. Install cloudflared
      # ============================================================
      - name: Install cloudflared
        run: |
          set -euo pipefail

          echo "Downloading cloudflared..."

          curl \
            -L \
            --fail \
            --retry 5 \
            --retry-delay 2 \
            -o /tmp/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64

          chmod +x /tmp/cloudflared

          echo "cloudflared version:"
          /tmp/cloudflared --version

      # ============================================================
      # 10. Start Cloudflare Quick Tunnel
      # ============================================================
      - name: Start Cloudflare Tunnel
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " Starting Cloudflare Quick Tunnel"
          echo "=========================================="

          nohup /tmp/cloudflared tunnel \
            --url "http://127.0.0.1:${VNC_PORT}" \
            --no-autoupdate \
            --loglevel info \
            > /tmp/cloudflared.log 2>&1 &

          CLOUDFLARED_PID=$!

          echo "cloudflared PID: $CLOUDFLARED_PID"

          PUBLIC_URL=""

          for i in $(seq 1 90); do

            if [ -f /tmp/cloudflared.log ]; then

              PUBLIC_URL=$(
                grep -oE \
                  'https://[A-Za-z0-9.-]+\.trycloudflare\.com' \
                  /tmp/cloudflared.log \
                  | head -n 1 \
                  || true
              )

            fi

            if [ -n "$PUBLIC_URL" ]; then
              break
            fi

            if [ $((i % 10)) -eq 0 ]; then
              echo ""
              echo "===== Cloudflare log ====="
              tail -n 30 /tmp/cloudflared.log || true
            fi

            sleep 2

          done

          if [ -z "$PUBLIC_URL" ]; then

            echo ""
            echo "=========================================="
            echo " CLOUDFLARE URL WAS NOT CREATED"
            echo "=========================================="

            cat /tmp/cloudflared.log || true

            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "       KASMVNC DESKTOP READY"
          echo "=========================================="
          echo ""
          echo "🌐 URL:"
          echo "$PUBLIC_URL"
          echo ""
          echo "👤 Username:"
          echo "$VNC_USER"
          echo ""
          echo "🔑 Password:"
          echo "$VNC_PASSWORD"
          echo ""
          echo "🖥️ XFCE"
          echo "🌐 KasmVNC"
          echo "📋 Clipboard"
          echo "🔊 PulseAudio"
          echo ""
          echo "=========================================="

          {
            echo "# 🖥️ KasmVNC Web Desktop"
            echo ""
            echo "## 🌐 Desktop URL"
            echo ""
            echo "$PUBLIC_URL"
            echo ""
            echo "## 🔐 Login"
            echo ""
            echo "**Username:** \`$VNC_USER\`"
            echo ""
            echo "**Password:** \`$VNC_PASSWORD\`"
            echo ""
            echo "## 🖥️ Desktop"
            echo ""
            echo "- XFCE"
            echo "- KasmVNC"
            echo "- HTML5 Web Client"
            echo "- Clipboard"
            echo "- PulseAudio"
            echo "- Cloudflare Quick Tunnel"
          } >> "$GITHUB_STEP_SUMMARY"

      # ============================================================
      # 11. Keep runner alive
      # ============================================================
      - name: Keep desktop alive
        run: |
          set -euo pipefail

          echo "Desktop will remain online for 6 hours."

          for i in $(seq 1 720); do

            if ! pgrep -u "$VNC_USER" Xvnc >/dev/null 2>&1; then
              echo "Xvnc stopped."
              exit 1
            fi

            if ! pgrep -f cloudflared >/dev/null 2>&1; then
              echo "cloudflared stopped."
              exit 1
            fi

            sleep 30

          done
