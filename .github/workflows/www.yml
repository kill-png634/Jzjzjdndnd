name: Web Desktop with Xpra + HTML5 + Audio

on:
  workflow_dispatch:

jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      XPRA_PORT: "14500"
      XDG_RUNTIME_DIR: /tmp/runtime-${{ github.run_id }}

    steps:
      # ============================================================
      # 1. Install XFCE, audio, browser and Xpra
      # ============================================================
      - name: Install desktop and Xpra
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            xfce4 \
            xfce4-goodies \
            dbus-x11 \
            x11-xserver-utils \
            xdg-utils \
            curl \
            wget \
            jq \
            iproute2 \
            netcat-openbsd \
            pulseaudio \
            pulseaudio-utils \
            gstreamer1.0-tools \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-pulseaudio \
            epiphany-browser \
            fonts-dejavu-core \
            ca-certificates \
            gnupg

          # Official Xpra repository
          curl -fsSL https://xpra.org/gpg.asc \
            | sudo gpg --dearmor --yes \
            -o /usr/share/keyrings/xpra.gpg

          echo "deb [signed-by=/usr/share/keyrings/xpra.gpg] https://xpra.org/ noble main" \
            | sudo tee /etc/apt/sources.list.d/xpra.list

          sudo apt-get update

          sudo apt-get install -y \
            xpra-server \
            xpra-html5 \
            xpra-audio-server

          echo "===== Xpra version ====="
          xpra --version

      # ============================================================
      # 2. Configure XFCE and browser
      # ============================================================
      - name: Configure desktop
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.config/xfce4"
          mkdir -p "$HOME/.local/bin"
          mkdir -p "$HOME/.local/share/applications"

          touch "$HOME/.Xresources"

          # Disable XFCE compositor for better remote performance
          xfconf-query \
            -c xfwm4 \
            -p /general/use_compositing \
            -s false || true

          # Browser fallback
          cat > "$HOME/.local/bin/browser-fallback" <<'EOF'
          #!/bin/sh

          URL="${1:-https://www.google.com}"

          if command -v epiphany-browser >/dev/null 2>&1; then
              exec epiphany-browser "$URL"
          fi

          if command -v firefox >/dev/null 2>&1; then
              exec firefox "$URL"
          fi

          if command -v chromium >/dev/null 2>&1; then
              exec chromium "$URL"
          fi

          if command -v chromium-browser >/dev/null 2>&1; then
              exec chromium-browser "$URL"
          fi

          if command -v google-chrome >/dev/null 2>&1; then
              exec google-chrome "$URL"
          fi

          echo "No supported browser installed."
          exit 1
          EOF

          chmod +x "$HOME/.local/bin/browser-fallback"

          cat > "$HOME/.local/share/applications/browser-fallback.desktop" <<EOF
          [Desktop Entry]
          Name=Web Browser
          Comment=Web Browser
          Exec=$HOME/.local/bin/browser-fallback %u
          Terminal=false
          Type=Application
          Categories=Network;WebBrowser;
          MimeType=text/html;x-scheme-handler/http;x-scheme-handler/https;
          EOF

          xdg-mime default browser-fallback.desktop x-scheme-handler/http || true
          xdg-mime default browser-fallback.desktop x-scheme-handler/https || true
          xdg-mime default browser-fallback.desktop text/html || true

      # ============================================================
      # 3. Start PulseAudio
      # ============================================================
      - name: Start PulseAudio
        run: |
          set -euo pipefail

          export XDG_RUNTIME_DIR="$XDG_RUNTIME_DIR"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"

          pulseaudio \
            --start \
            --daemonize=true \
            --exit-idle-time=-1 \
            --log-target=stderr || true

          sleep 2

          echo "===== PulseAudio ====="
          pactl info || true

      # ============================================================
      # 4. Start Xpra and verify it is ready
      # ============================================================
      - name: Start Xpra
        run: |
          set -euo pipefail

          export XDG_RUNTIME_DIR="$XDG_RUNTIME_DIR"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"

          echo "Starting Xpra..."

          nohup xpra desktop :100 \
            --bind-tcp=127.0.0.1:${XPRA_PORT} \
            --html=on \
            --mdns=no \
            --daemon=yes \
            --pulseaudio=yes \
            --speaker=on \
            --microphone=on \
            --clipboard=yes \
            --notifications=yes \
            --resize-display=yes \
            --desktop-scaling=off \
            --dpi=96 \
            --encoding=auto \
            --min-quality=50 \
            --exit-with-children=yes \
            --start-child="dbus-launch --exit-with-session xfce4-session" \
            > /tmp/xpra.log 2>&1 &

          echo "Waiting for Xpra HTTP endpoint..."
          READY=0

          for i in $(seq 1 90); do
            if ss -lnt | grep -q ":${XPRA_PORT} "; then
              if curl -fsS "http://127.0.0.1:${XPRA_PORT}/" >/dev/null 2>&1; then
                READY=1
                break
              fi
            fi
            sleep 2
          done

          echo ""
          echo "===== Xpra log ====="
          tail -n 120 /tmp/xpra.log || true

          echo ""
          echo "===== Xpra server log ====="
          find "$XDG_RUNTIME_DIR/xpra" -name server.log -type f -print -exec tail -n 120 {} \; || true

          echo ""
          echo "===== Xpra sessions ====="
          xpra list || true

          if [ "$READY" -ne 1 ]; then
            echo ""
            echo "XPRA DID NOT BECOME READY"
            echo "Check /tmp/xpra.log and $XDG_RUNTIME_DIR/xpra/100/server.log"
            exit 1
          fi

          echo "Xpra is ready on 127.0.0.1:${XPRA_PORT}"

      # ============================================================
      # 5. Start Cloudflare Quick Tunnel
      # ============================================================
      - name: Start Cloudflare Tunnel
        run: |
          set -euo pipefail

          echo "Downloading cloudflared..."
          curl -L --fail \
            --retry 5 \
            --retry-delay 2 \
            -o cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64

          chmod +x cloudflared

          echo "Starting Cloudflare Quick Tunnel..."
          nohup ./cloudflared tunnel \
            --url "http://127.0.0.1:${XPRA_PORT}" \
            --no-autoupdate \
            --loglevel info \
            > /tmp/cloudflared.log 2>&1 &

          PUBLIC_URL=""

          echo "Waiting for Cloudflare URL..."
          for i in $(seq 1 90); do
            if [ -f /tmp/cloudflared.log ]; then
              PUBLIC_URL=$(
                grep -oE 'https://[A-Za-z0-9.-]+\.trycloudflare\.com' \
                  /tmp/cloudflared.log | head -n 1 || true
              )
            fi

            if [ -n "$PUBLIC_URL" ]; then
              break
            fi

            if [ $((i % 10)) -eq 0 ]; then
              echo ""
              echo "===== cloudflared output ====="
              tail -n 30 /tmp/cloudflared.log || true
              echo ""
            fi

            sleep 2
          done

          if [ -z "$PUBLIC_URL" ]; then
            echo ""
            echo "=========================================="
            echo "      CLOUDFLARE TUNNEL FAILED"
            echo "=========================================="
            echo ""
            echo "===== cloudflared log ====="
            cat /tmp/cloudflared.log || true
            echo ""
            echo "===== Xpra log ====="
            cat /tmp/xpra.log || true
            echo ""
            echo "===== Listening ports ====="
            ss -lntp || true
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "       XPRA WEB DESKTOP READY"
          echo "=========================================="
          echo ""
          echo "Desktop URL:"
          echo "$PUBLIC_URL"
          echo ""

          {
            echo "## 🖥️ Xpra Web Desktop"
            echo ""
            echo "### 🔗 Desktop URL"
            echo ""
            echo "$PUBLIC_URL"
            echo ""
            echo "### Features"
            echo ""
            echo "- 🖥️ XFCE Desktop"
            echo "- 🌐 HTML5 Web Client"
            echo "- 🔊 Audio forwarding"
            echo "- 🎤 Microphone forwarding"
            echo "- 📋 Clipboard"
            echo "- 🔔 Notifications"
            echo "- ⚡ Xpra remote desktop"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Keeping desktop alive for 6 hours..."
          sleep 21600
