name: Web Desktop with noVNC & Cloudflare Tunnel

on:
  workflow_dispatch:

env:
  PERSIST_DIR: ${{ github.workspace }}/persist

jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Restore persistent state cache
        id: persist-cache
        uses: actions/cache@v6
        with:
          path: persist
          key: desktop-state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            desktop-state-${{ runner.os }}-

      - name: Merge restored state into home
        run: |
          set -euo pipefail
          PERSIST_HOME="$PERSIST_DIR/home"
          if [ -d "$PERSIST_HOME" ]; then
            for item in \
              ".vnc" \
              ".local/bin" \
              ".local/share/applications" \
              ".config/xfce4" \
              ".config/epiphany" \
              ".local/share/epiphany" \
              ".config/chromium" \
              ".config/google-chrome" \
              ".mozilla/firefox" \
              "Downloads" \
              "Desktop" \
              "Documents"
            do
              if [ -e "$PERSIST_HOME/$item" ]; then
                mkdir -p "$HOME/$(dirname "$item")"
                rsync -a "$PERSIST_HOME/$item/" "$HOME/$item/" || true
              fi
            done
          fi

      - name: Install required packages
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            xfce4 xfce4-goodies \
            tigervnc-standalone-server \
            novnc websockify \
            dbus-x11 x11-xserver-utils \
            xdg-utils \
            curl jq rsync \
            epiphany-browser \
            fonts-dejavu-core

      - name: Configure desktop, VNC and browser fallback
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.vnc"
          mkdir -p "$HOME/.local/bin"
          mkdir -p "$HOME/.local/share/applications"
          touch "$HOME/.Xresources"
          touch "$HOME/.Xauthority"

          # VNC password
          echo "password" | vncpasswd -f > "$HOME/.vnc/passwd"
          chmod 600 "$HOME/.vnc/passwd"

          # XFCE startup
          cat > "$HOME/.vnc/xstartup" <<'EOF'
          #!/bin/sh
          unset SESSION_MANAGER
          unset DBUS_SESSION_BUS_ADDRESS
          touch "$HOME/.Xresources"
          xrdb "$HOME/.Xresources"
          exec dbus-launch --exit-with-session startxfce4
          EOF
          chmod +x "$HOME/.vnc/xstartup"

          # Browser fallback wrapper
          cat > "$HOME/.local/bin/browser-fallback" <<'EOF'
          #!/bin/sh
          URL="${1:-https://www.google.com}"

          if command -v epiphany-browser >/dev/null 2>&1; then
              exec epiphany-browser "$URL"
          fi

          if command -v firefox >/dev/null 2>&1; then
              exec firefox "$URL"
          fi

          if command -v chromium >/dev/null 2>&1; then
              exec chromium "$URL"
          fi

          if command -v chromium-browser >/dev/null 2>&1; then
              exec chromium-browser "$URL"
          fi

          if command -v google-chrome >/dev/null 2>&1; then
              exec google-chrome "$URL"
          fi

          echo "No supported browser found."
          exit 1
          EOF
          chmod +x "$HOME/.local/bin/browser-fallback"

          # Default browser desktop file
          cat > "$HOME/.local/share/applications/browser-fallback.desktop" <<EOF
          [Desktop Entry]
          Name=Web Browser
          Comment=Fallback Web Browser
          Exec=$HOME/.local/bin/browser-fallback %u
          Terminal=false
          Type=Application
          Categories=Network;WebBrowser;
          MimeType=text/html;x-scheme-handler/http;x-scheme-handler/https;
          EOF

          xdg-mime default browser-fallback.desktop x-scheme-handler/http || true
          xdg-mime default browser-fallback.desktop x-scheme-handler/https || true
          xdg-mime default browser-fallback.desktop text/html || true
          xdg-settings set default-web-browser browser-fallback.desktop || true

      - name: Start services and expose with Cloudflare
        run: |
          set -euo pipefail

          PERSIST_HOME="$PERSIST_DIR/home"
          mkdir -p "$PERSIST_HOME"

          sync_state() {
            mkdir -p "$PERSIST_HOME"
            for item in \
              ".vnc" \
              ".local/bin" \
              ".local/share/applications" \
              ".config/xfce4" \
              ".config/epiphany" \
              ".local/share/epiphany" \
              ".config/chromium" \
              ".config/google-chrome" \
              ".mozilla/firefox" \
              "Downloads" \
              "Desktop" \
              "Documents"
            do
              if [ -e "$HOME/$item" ]; then
                mkdir -p "$PERSIST_HOME/$(dirname "$item")"
                rsync -a "$HOME/$item/" "$PERSIST_HOME/$item/" || true
              fi
            done
          }

          stop_bg() {
            if [ -n "${BACKUP_PID:-}" ] && kill -0 "$BACKUP_PID" 2>/dev/null; then
              kill "$BACKUP_PID" 2>/dev/null || true
              wait "$BACKUP_PID" 2>/dev/null || true
            fi
          }

          cleanup() {
            stop_bg
            sync_state || true
          }

          trap cleanup EXIT INT TERM

          # Start VNC display :1 -> port 5901
          vncserver :1 -geometry 1280x720 -depth 24 -localhost yes
          sleep 3

          # Start noVNC proxy
          websockify --web=/usr/share/novnc/ 6080 localhost:5901 > /tmp/websockify.log 2>&1 &
          sleep 2

          # Download cloudflared
          curl -L --fail -o cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared

          # Start periodic persistence loop
          backup_loop() {
            while true; do
              sync_state
              sleep 180
            done
          }
          backup_loop &
          BACKUP_PID=$!

          # Start tunnel
          nohup ./cloudflared tunnel \
            --url http://127.0.0.1:6080 \
            --no-autoupdate \
            --logfile /tmp/cloudflared.log \
            >/tmp/cloudflared.stdout 2>&1 &

          # Wait for public URL
          PUBLIC_URL=""
          for i in $(seq 1 60); do
            PUBLIC_URL=$(grep -oE 'https://[-a-z0-9]+\.trycloudflare\.com' /tmp/cloudflared.log | head -n 1 || true)
            if [ -n "$PUBLIC_URL" ]; then
              break
            fi
            sleep 2
          done

          if [ -z "$PUBLIC_URL" ]; then
            echo "Cloudflared failed."
            echo "--- cloudflared.log ---"
            cat /tmp/cloudflared.log || true
            echo "--- cloudflared.stdout ---"
            cat /tmp/cloudflared.stdout || true
            exit 1
          fi

          echo "Desktop URL: $PUBLIC_URL"
          echo "Desktop URL: $PUBLIC_URL" >> "$GITHUB_STEP_SUMMARY"

          # Save immediately once after startup too
          sync_state

          # Keep job alive
          sleep 21600
