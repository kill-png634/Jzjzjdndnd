name: Lightweight Web Desktop with Openbox + KasmVNC + Cloudflare

on:
  workflow_dispatch:

jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install lightweight desktop
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            openbox \
            xterm \
            dbus-x11 \
            x11-xserver-utils \
            xdg-utils \
            curl \
            wget \
            ca-certificates \
            jq \
            fonts-dejavu-core

      - name: Install KasmVNC
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " Installing KasmVNC"
          echo "=========================================="

          ARCH="$(dpkg --print-architecture)"
          echo "Architecture: $ARCH"

          if [ "$ARCH" = "amd64" ]; then
            KASM_URL="https://github.com/kasmtech/KasmVNC/releases/latest/download/kasmvncserver_ubuntu_jammy_amd64.deb"
          elif [ "$ARCH" = "arm64" ]; then
            KASM_URL="https://github.com/kasmtech/KasmVNC/releases/latest/download/kasmvncserver_ubuntu_jammy_arm64.deb"
          else
            echo "Unsupported architecture: $ARCH"
            exit 1
          fi

          wget -O /tmp/kasmvnc.deb "$KASM_URL"

          sudo apt-get install -y /tmp/kasmvnc.deb || {
            sudo apt-get -f install -y
            sudo apt-get install -y /tmp/kasmvnc.deb
          }

          rm -f /tmp/kasmvnc.deb

          echo "KasmVNC installed."

      - name: Configure Openbox and KasmVNC
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.vnc"
          mkdir -p "$HOME/.config/openbox"
          mkdir -p "$HOME/.local/bin"
          mkdir -p "$HOME/.local/share/applications"

          touch "$HOME/.Xresources"

          # VNC password
          echo "password" | vncpasswd -f > "$HOME/.vnc/passwd"
          chmod 600 "$HOME/.vnc/passwd"

          # Openbox configuration
          cat > "$HOME/.config/openbox/rc.xml" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>

          <openbox_config xmlns="http://openbox.org/3.4/rc">

            <focus>
              <focusNew>yes</focusNew>
              <followMouse>no</followMouse>
              <focusLast>yes</focusLast>
              <underMouse>no</underMouse>
              <raiseOnFocus>no</raiseOnFocus>
            </focus>

            <desktops>
              <number>1</number>
              <firstdesk>1</firstdesk>
            </desktops>

            <applications>
              <application class="*">
                <decor>yes</decor>
              </application>
            </applications>

          </openbox_config>
          EOF

          # Lightweight startup
          cat > "$HOME/.vnc/xstartup" <<'EOF'
          #!/bin/sh

          unset SESSION_MANAGER
          unset DBUS_SESSION_BUS_ADDRESS

          export XDG_CURRENT_DESKTOP=Openbox
          export XDG_SESSION_DESKTOP=Openbox

          xrdb "$HOME/.Xresources" || true

          if command -v dbus-launch >/dev/null 2>&1; then
              exec dbus-launch --exit-with-session openbox-session
          else
              exec openbox-session
          fi
          EOF

          chmod +x "$HOME/.vnc/xstartup"

          # Browser launcher
          cat > "$HOME/.local/bin/browser-fallback" <<'EOF'
          #!/bin/sh

          URL="${1:-https://www.google.com}"

          if command -v chromium >/dev/null 2>&1; then
              exec chromium \
                --disable-gpu \
                --disable-dev-shm-usage \
                --no-sandbox \
                "$URL"
          fi

          if command -v chromium-browser >/dev/null 2>&1; then
              exec chromium-browser \
                --disable-gpu \
                --disable-dev-shm-usage \
                --no-sandbox \
                "$URL"
          fi

          if command -v firefox >/dev/null 2>&1; then
              exec firefox "$URL"
          fi

          echo "No supported browser found."
          exit 1
          EOF

          chmod +x "$HOME/.local/bin/browser-fallback"

          # Desktop launcher
          cat > "$HOME/.local/share/applications/browser-fallback.desktop" <<EOF
          [Desktop Entry]
          Name=Web Browser
          Comment=Lightweight Web Browser
          Exec=$HOME/.local/bin/browser-fallback %u
          Terminal=false
          Type=Application
          Categories=Network;WebBrowser;
          MimeType=text/html;x-scheme-handler/http;x-scheme-handler/https;
          EOF

          xdg-mime default browser-fallback.desktop x-scheme-handler/http || true
          xdg-mime default browser-fallback.desktop x-scheme-handler/https || true
          xdg-mime default browser-fallback.desktop text/html || true

      - name: Start KasmVNC and Cloudflare
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " Starting lightweight desktop"
          echo "=========================================="

          # Remove possible old VNC sessions
          vncserver -kill :1 >/dev/null 2>&1 || true

          # Start KasmVNC
          vncserver :1 \
            -geometry 1280x720 \
            -depth 24 \
            -localhost yes

          sleep 5

          echo "KasmVNC started."

          # KasmVNC normally listens on 6901.
          # Detect actual listening port.
          VNC_PORT=""

          for i in $(seq 1 30); do
            VNC_PORT=$(ss -lntp 2>/dev/null | \
              grep -E ':(690[0-9]|590[0-9]) ' | \
              sed -n '1p' | \
              grep -oE ':[0-9]+' | \
              tr -d ':' || true)

            if [ -n "$VNC_PORT" ]; then
              break
            fi

            sleep 2
          done

          if [ -z "$VNC_PORT" ]; then
            echo "Could not detect KasmVNC port."
            ps aux | grep -i vnc || true
            ss -lntp || true
            exit 1
          fi

          echo "Detected VNC port: $VNC_PORT"

          # Cloudflared
          curl -L --fail \
            -o /tmp/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64

          chmod +x /tmp/cloudflared

          # Start Cloudflare Quick Tunnel
          nohup /tmp/cloudflared tunnel \
            --url "http://127.0.0.1:${VNC_PORT}" \
            --no-autoupdate \
            --logfile /tmp/cloudflared.log \
            >/tmp/cloudflared.stdout 2>&1 &

          echo "Waiting for Cloudflare URL..."

          PUBLIC_URL=""

          for i in $(seq 1 90); do

            PUBLIC_URL=$(
              grep -oE \
                'https://[-a-z0-9]+\.trycloudflare\.com' \
                /tmp/cloudflared.log \
                2>/dev/null |
              head -n 1 || true
            )

            if [ -n "$PUBLIC_URL" ]; then
              break
            fi

            PUBLIC_URL=$(
              grep -oE \
                'https://[-a-z0-9]+\.trycloudflare\.com' \
                /tmp/cloudflared.stdout \
                2>/dev/null |
              head -n 1 || true
            )

            if [ -n "$PUBLIC_URL" ]; then
              break
            fi

            sleep 2
          done

          if [ -z "$PUBLIC_URL" ]; then
            echo "Cloudflare Tunnel failed."

            echo "========== cloudflared.log =========="
            cat /tmp/cloudflared.log || true

            echo "========== cloudflared.stdout =========="
            cat /tmp/cloudflared.stdout || true

            exit 1
          fi

          echo ""
          echo "=========================================="
          echo " DESKTOP READY"
          echo "=========================================="
          echo ""
          echo "Desktop URL:"
          echo "$PUBLIC_URL"
          echo ""

          echo "## 🖥️ Lightweight Web Desktop" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Desktop URL:** $PUBLIC_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**VNC Port:** $VNC_PORT" >> "$GITHUB_STEP_SUMMARY"

          # Keep workflow alive
          while true; do
            sleep 60

            if ! pgrep -f "cloudflared tunnel" >/dev/null; then
              echo "Cloudflare process stopped."
              exit 1
            fi

            if ! pgrep -f "vnc" >/dev/null; then
              echo "VNC process stopped."
              exit 1
            fi
          done
