name: Web Desktop with Xpra + HTML5 + Audio

on:
  workflow_dispatch:

jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:

      # ============================================================
      # 1. Install XFCE, audio, browser and Xpra
      # ============================================================
      - name: Install desktop and Xpra
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            xfce4 \
            xfce4-goodies \
            dbus-x11 \
            x11-xserver-utils \
            xdg-utils \
            curl \
            wget \
            jq \
            pulseaudio \
            pulseaudio-utils \
            gstreamer1.0-tools \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-pulseaudio \
            epiphany-browser \
            fonts-dejavu-core \
            ca-certificates \
            gnupg

          # Official Xpra repository
          curl -fsSL https://xpra.org/gpg.asc \
            | sudo gpg --dearmor --yes \
            -o /usr/share/keyrings/xpra.gpg

          echo "deb [signed-by=/usr/share/keyrings/xpra.gpg] https://xpra.org/ noble main" \
            | sudo tee /etc/apt/sources.list.d/xpra.list

          sudo apt-get update

          sudo apt-get install -y \
            xpra-server \
            xpra-html5 \
            xpra-audio-server

          echo "===== Xpra version ====="
          xpra --version


      # ============================================================
      # 2. Configure XFCE and browser
      # ============================================================
      - name: Configure desktop
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.config/xfce4"
          mkdir -p "$HOME/.local/bin"
          mkdir -p "$HOME/.local/share/applications"

          touch "$HOME/.Xresources"

          # Disable XFCE compositor for better remote performance
          xfconf-query \
            -c xfwm4 \
            -p /general/use_compositing \
            -s false || true

          # --------------------------------------------------------
          # Browser fallback
          # --------------------------------------------------------
          cat > "$HOME/.local/bin/browser-fallback" <<'EOF'
          #!/bin/sh

          URL="${1:-https://www.google.com}"

          if command -v epiphany-browser >/dev/null 2>&1; then
              exec epiphany-browser "$URL"
          fi

          if command -v firefox >/dev/null 2>&1; then
              exec firefox "$URL"
          fi

          if command -v chromium >/dev/null 2>&1; then
              exec chromium "$URL"
          fi

          if command -v chromium-browser >/dev/null 2>&1; then
              exec chromium-browser "$URL"
          fi

          if command -v google-chrome >/dev/null 2>&1; then
              exec google-chrome "$URL"
          fi

          echo "No supported browser installed."
          exit 1
          EOF

          chmod +x "$HOME/.local/bin/browser-fallback"

          cat > "$HOME/.local/share/applications/browser-fallback.desktop" <<EOF
          [Desktop Entry]
          Name=Web Browser
          Comment=Web Browser
          Exec=$HOME/.local/bin/browser-fallback %u
          Terminal=false
          Type=Application
          Categories=Network;WebBrowser;
          MimeType=text/html;x-scheme-handler/http;x-scheme-handler/https;
          EOF

          xdg-mime default browser-fallback.desktop \
            x-scheme-handler/http || true

          xdg-mime default browser-fallback.desktop \
            x-scheme-handler/https || true

          xdg-mime default browser-fallback.desktop \
            text/html || true


      # ============================================================
      # 3. Start PulseAudio
      # ============================================================
      - name: Start PulseAudio
        run: |
          set -euo pipefail

          export XDG_RUNTIME_DIR="/tmp/runtime-$USER"

          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"

          pulseaudio \
            --start \
            --daemonize=true \
            --exit-idle-time=-1 \
            --log-target=stderr || true

          sleep 2

          echo "===== PulseAudio ====="
          pactl info || true


      # ============================================================
      # 4. Start Xpra
      # ============================================================
      - name: Start Xpra
        run: |
          set -euo pipefail

          export XDG_RUNTIME_DIR="/tmp/runtime-$USER"

          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"

          echo "Starting Xpra..."

          xpra start-desktop :100 \
            --bind-tcp=127.0.0.1:14500 \
            --html=on \
            --mdns=no \
            --daemon=yes \
            --pulseaudio=yes \
            --speaker=on \
            --microphone=on \
            --clipboard=yes \
            --notifications=yes \
            --resize-display=yes \
            --desktop-scaling=off \
            --dpi=96 \
            --encoding=auto \
            --min-quality=50 \
            --start-child="dbus-launch --exit-with-session startxfce4"

          echo "Waiting for Xpra..."

          for i in $(seq 1 30); do
            if ss -lnt | grep -q ":14500"; then
              echo "Xpra is listening on port 14500."
              break
            fi

            sleep 1
          done

          echo ""
          echo "===== Xpra sessions ====="
          xpra list || true

          echo ""
          echo "===== Port 14500 ====="
          ss -lntp | grep 14500 || true


      # ============================================================
      # 5. Start Cloudflare Quick Tunnel
      # ============================================================
      - name: Start Cloudflare Tunnel
        run: |
          set -euo pipefail

          echo "Downloading cloudflared..."

          curl -L --fail \
            --retry 5 \
            --retry-delay 2 \
            -o cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64

          chmod +x cloudflared

          echo "Starting Cloudflare Quick Tunnel..."

          nohup ./cloudflared tunnel \
            --url http://127.0.0.1:14500 \
            --no-autoupdate \
            > /tmp/cloudflared.out 2>&1 &

          CLOUDFLARED_PID=$!

          echo "cloudflared PID: $CLOUDFLARED_PID"

          PUBLIC_URL=""

          echo "Waiting for Cloudflare URL..."

          for i in $(seq 1 90); do

            if [ -f /tmp/cloudflared.out ]; then

              PUBLIC_URL=$(
                grep -oE \
                  'https://[A-Za-z0-9.-]+\.trycloudflare\.com' \
                  /tmp/cloudflared.out \
                  | head -n 1 || true
              )

            fi

            if [ -n "$PUBLIC_URL" ]; then
              break
            fi

            # Print recent output every 10 seconds
            if [ $((i % 10)) -eq 0 ]; then
              echo ""
              echo "===== Cloudflared output ====="
              tail -n 20 /tmp/cloudflared.out || true
              echo ""
            fi

            sleep 2

          done

          if [ -z "$PUBLIC_URL" ]; then

            echo ""
            echo "=========================================="
            echo "      CLOUDFLARE TUNNEL FAILED"
            echo "=========================================="

            echo ""
            echo "===== cloudflared output ====="
            cat /tmp/cloudflared.out || true

            echo ""
            echo "===== Xpra ====="
            xpra list || true

            echo ""
            echo "===== Listening ports ====="
            ss -lntp || true

            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "       XPRA WEB DESKTOP READY"
          echo "=========================================="
          echo ""
          echo "Desktop URL:"
          echo "$PUBLIC_URL"
          echo ""
          echo "Open this URL in your browser."
          echo ""
          echo "Audio: enabled"
          echo "Clipboard: enabled"
          echo "XFCE: enabled"
          echo ""
          echo "=========================================="

          # GitHub Actions summary
          {
            echo "## 🖥️ Xpra Web Desktop"
            echo ""
            echo "### 🔗 Desktop URL"
            echo ""
            echo "$PUBLIC_URL"
            echo ""
            echo "### Features"
            echo ""
            echo "- 🖥️ XFCE Desktop"
            echo "- 🌐 HTML5 Web Client"
            echo "- 🔊 Audio forwarding"
            echo "- 🎤 Microphone forwarding"
            echo "- 📋 Clipboard"
            echo "- 🔔 Notifications"
            echo "- ⚡ Xpra remote desktop"
          } >> "$GITHUB_STEP_SUMMARY"

          # Keep the runner alive
          echo ""
          echo "Keeping desktop alive for 6 hours..."

          sleep 21600
