name: KasmVNC Web Desktop + XFCE + Cloudflare

on:
  workflow_dispatch:

jobs:
  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      DISPLAY_NUM: ":1"
      KASM_PORT: "8444"
      DESKTOP_RESOLUTION: "1280x720"
      VNC_USER: "runner"

    steps:

      # ============================================================
      # 1. Install XFCE + required dependencies
      # ============================================================
      - name: Install XFCE and dependencies
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " Installing XFCE and dependencies"
          echo "=========================================="

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 \
            xfce4-goodies \
            dbus-x11 \
            dbus-user-session \
            xdg-utils \
            x11-xserver-utils \
            x11-utils \
            xauth \
            xfonts-base \
            fonts-dejavu \
            fonts-liberation \
            curl \
            wget \
            jq \
            ca-certificates \
            gnupg \
            iproute2 \
            net-tools \
            procps \
            openssl \
            pulseaudio \
            pulseaudio-utils \
            pavucontrol \
            alsa-utils \
            mesa-utils \
            git

          echo ""
          echo "===== Ubuntu ====="
          lsb_release -a || true

          echo ""
          echo "===== XFCE ====="
          xfce4-session --version || true


      # ============================================================
      # 2. Configure XFCE
      # ============================================================
      - name: Configure XFCE
        shell: bash
        run: |
          set -euo pipefail

          echo "Configuring XFCE..."

          mkdir -p "$HOME/.config/xfce4/xfconf/xfce-perchannel-xml"
          mkdir -p "$HOME/.local/bin"

          # Disable compositor for better remote performance
          cat > "$HOME/.config/xfce4/xfconf/xfce-perchannel-xml/xfwm4.xml" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>

          <channel name="xfwm4" version="1.0">
            <property name="general" type="empty">
              <property name="use_compositing" type="bool" value="false"/>
              <property name="show_dock_shadow" type="bool" value="false"/>
              <property name="show_frame_shadow" type="bool" value="false"/>
            </property>
          </channel>
          EOF

          # Basic XFCE settings
          cat > "$HOME/.config/xfce4/xfconf/xfce-perchannel-xml/xsettings.xml" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>

          <channel name="xsettings" version="1.0">
            <property name="Net" type="empty">
              <property name="ThemeName" type="string" value="Default"/>
              <property name="IconThemeName" type="string" value="elementary-xfce-dark"/>
              <property name="DoubleClickTime" type="int" value="400"/>
              <property name="DoubleClickDistance" type="int" value="5"/>
            </property>
          </channel>
          EOF

          echo "XFCE configured."


      # ============================================================
      # 3. Install KasmVNC
      # ============================================================
      - name: Install KasmVNC
        shell: bash
        run: |
          set -euo pipefail

          KASM_VERSION="1.5.0"

          echo "=========================================="
          echo " Installing KasmVNC ${KASM_VERSION}"
          echo "=========================================="

          ARCH="$(dpkg --print-architecture)"

          if [ "$ARCH" != "amd64" ]; then
            echo "Unsupported architecture: $ARCH"
            exit 1
          fi

          echo "Architecture: $ARCH"

          # --------------------------------------------------------
          # Query the official GitHub release API
          # --------------------------------------------------------
          RELEASE_JSON="$(
            curl -fsSL \
              --retry 5 \
              --retry-delay 2 \
              "https://api.github.com/repos/kasmtech/KasmVNC/releases/tags/v${KASM_VERSION}"
          )"

          echo "$RELEASE_JSON" > /tmp/kasm-release.json

          # --------------------------------------------------------
          # Find Debian/Ubuntu amd64 package.
          #
          # Kasm publishes distro-specific .deb packages.
          # Prefer Noble/Ubuntu 24.04 when available.
          # Fall back to Bookworm only if no Noble package exists.
          # --------------------------------------------------------
          KASM_DEB_URL="$(
            echo "$RELEASE_JSON" |
              jq -r '
                [
                  .assets[]
                  | select(.name | test("^kasmvncserver_.*_1\\.5\\.0_amd64\\.deb$"))
                  | .browser_download_url
                ]
                | map(select(test("noble|ubuntu24|ubuntu_24"; "i")))
                | .[0]
              '
          )"

          if [ -z "$KASM_DEB_URL" ] || [ "$KASM_DEB_URL" = "null" ]; then
            KASM_DEB_URL="$(
              echo "$RELEASE_JSON" |
                jq -r '
                  [
                    .assets[]
                    | select(.name | test("^kasmvncserver_.*_1\\.5\\.0_amd64\\.deb$"))
                    | .browser_download_url
                  ]
                  | map(select(test("bookworm"; "i")))
                  | .[0]
                '
            "
          fi

          if [ -z "$KASM_DEB_URL" ] || [ "$KASM_DEB_URL" = "null" ]; then
            echo ""
            echo "ERROR: Could not find an official KasmVNC amd64 .deb."
            echo ""
            echo "Available Debian packages:"
            echo "$RELEASE_JSON" |
              jq -r '.assets[].name | select(endswith(".deb"))' || true
            exit 1
          fi

          echo ""
          echo "KasmVNC package:"
          echo "$KASM_DEB_URL"

          # --------------------------------------------------------
          # Download
          # --------------------------------------------------------
          wget \
            --retry-connrefused \
            --tries=5 \
            --waitretry=2 \
            -O /tmp/kasmvnc.deb \
            "$KASM_DEB_URL"

          echo ""
          echo "Package downloaded:"
          ls -lh /tmp/kasmvnc.deb

          # --------------------------------------------------------
          # Install
          # --------------------------------------------------------
          sudo apt-get install -y /tmp/kasmvnc.deb

          echo ""
          echo "===== KasmVNC version ====="
          vncserver --version || true

          echo ""
          echo "===== KasmVNC binary ====="
          command -v vncserver
          command -v vncpasswd


      # ============================================================
      # 4. Configure KasmVNC
      # ============================================================
      - name: Configure KasmVNC
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " Configuring KasmVNC"
          echo "=========================================="

          mkdir -p "$HOME/.vnc"

          # --------------------------------------------------------
          # KasmVNC user configuration
          # --------------------------------------------------------
          cat > "$HOME/.vnc/kasmvnc.yaml" <<EOF
          desktop:
            resolution:
              width: 1280
              height: 720
            allow_resize: true
            pixel_depth: 24
            gpu:
              hw3d: false

          network:
            protocol: http
            interface: 127.0.0.1
            websocket_port: ${KASM_PORT}
            use_ipv4: true
            use_ipv6: false
            udp:
              public_ip: auto
              port: auto
              stun_server: auto
            ssl:
              require_ssl: false

          user_session:
            new_session_disconnects_existing_exclusive_session: false
            concurrent_connections_prompt: false
            concurrent_connections_prompt_timeout: 10
            idle_timeout: never

          pointer:
            enabled: true

          data_loss_prevention:
            clipboard:
              delay_between_operations: none
              allow_mimetypes:
                - chromium/x-web-custom-data
                - text/html
                - image/png
                - text/plain
              server_to_client:
                enabled: true
                size: unlimited
                primary_clipboard_enabled: true
              client_to_server:
                enabled: true
                size: unlimited

          encoding:
            max_frame_rate: 60
            video_encoding_mode:
              max_resolution:
                width: 1280
                height: 720

          server:
            http:
              httpd_directory: /usr/share/kasmvnc/www
            advanced:
              kasm_password_file: \${HOME}/.kasmpasswd
            auto_shutdown:
              no_user_session_timeout: never
              active_user_session_timeout: never
              inactive_user_session_timeout: never

          logging:
            log_writer_name: all
            log_dest: logfile
            level: 30
          EOF

          chmod 600 "$HOME/.vnc/kasmvnc.yaml"

          echo "KasmVNC configuration:"
          cat "$HOME/.vnc/kasmvnc.yaml"


      # ============================================================
      # 5. Create KasmVNC password
      # ============================================================
      - name: Configure KasmVNC authentication
        shell: bash
        run: |
          set -euo pipefail

          echo "Creating KasmVNC password..."

          # Random password for this workflow run.
          PASSWORD="$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 18)"

          # Ensure we always have enough characters.
          if [ "${#PASSWORD}" -lt 8 ]; then
            PASSWORD="Kasm$(openssl rand -hex 8)"
          fi

          # KasmVNC password database.
          printf '%s\n' "$PASSWORD" | vncpasswd -u "$VNC_USER" -w -r

          chmod 600 "$HOME/.kasmpasswd" 2>/dev/null || true

          echo "KASM_USERNAME=$VNC_USER" >> "$GITHUB_ENV"

          # Do NOT print the password in normal logs.
          {
            echo "## 🔐 KasmVNC Login"
            echo ""
            echo "**Username:** \`$VNC_USER\`"
            echo ""
            echo "**Password:** generated automatically for this run."
            echo ""
            echo "> The password is intentionally not printed into the public workflow log."
          } >> "$GITHUB_STEP_SUMMARY"

          # Store only inside the current runner environment.
          echo "KASM_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"


      # ============================================================
      # 6. Create XFCE startup script
      # ============================================================
      - name: Create XFCE startup
        shell: bash
        run: |
          set -euo pipefail

          cat > "$HOME/.vnc/xstartup" <<'EOF'
          #!/bin/sh

          unset SESSION_MANAGER
          unset DBUS_SESSION_BUS_ADDRESS

          export XDG_CURRENT_DESKTOP=XFCE
          export XDG_SESSION_DESKTOP=xfce
          export DESKTOP_SESSION=xfce
          export XDG_CONFIG_DIRS=/etc/xdg/xdg-xfce:/etc/xdg
          export XDG_DATA_DIRS=/usr/share/xfce4:/usr/local/share:/usr/share

          # Start a per-session DBus.
          if command -v dbus-launch >/dev/null 2>&1; then
              exec dbus-launch --exit-with-session startxfce4
          fi

          exec startxfce4
          EOF

          chmod +x "$HOME/.vnc/xstartup"

          echo "XFCE startup script ready."


      # ============================================================
      # 7. Start PulseAudio
      # ============================================================
      - name: Start PulseAudio
        shell: bash
        run: |
          set -euo pipefail

          export XDG_RUNTIME_DIR="/tmp/kasm-runtime-${GITHUB_RUN_ID}"

          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"

          echo "Starting PulseAudio..."

          pulseaudio \
            --start \
            --daemonize=true \
            --exit-idle-time=-1 \
            --log-target=stderr || true

          sleep 2

          echo ""
          echo "===== PulseAudio ====="
          pactl info || true

          # Create a null sink so applications have an audio device.
          pactl load-module module-null-sink \
            sink_name=KasmOutput \
            sink_properties=device.description=KasmOutput \
            2>/dev/null || true

          pactl set-default-sink KasmOutput 2>/dev/null || true

          echo ""
          echo "===== Audio sinks ====="
          pactl list short sinks || true


      # ============================================================
      # 8. Start KasmVNC
      # ============================================================
      - name: Start KasmVNC
        shell: bash
        run: |
          set -euo pipefail

          export DISPLAY="$DISPLAY_NUM"

          echo "=========================================="
          echo " Starting KasmVNC"
          echo "=========================================="

          # Remove stale session if present.
          vncserver -kill "$DISPLAY" >/dev/null 2>&1 || true

          rm -f \
            "$HOME/.vnc/"*.pid \
            "$HOME/.vnc/"*.log \
            2>/dev/null || true

          # --------------------------------------------------------
          # Start KasmVNC
          # --------------------------------------------------------
          vncserver "$DISPLAY" \
            -geometry "$DESKTOP_RESOLUTION" \
            -depth 24 \
            -xstartup "$HOME/.vnc/xstartup"

          echo ""
          echo "Waiting for KasmVNC..."

          READY=0

          for i in $(seq 1 60); do

            if pgrep -u "$USER" -f "Xvnc.*${DISPLAY}" >/dev/null 2>&1; then

              if ss -lnt 2>/dev/null |
                grep -q ":${KASM_PORT} "; then

                READY=1
                break
              fi

            fi

            sleep 2
          done

          echo ""
          echo "===== KasmVNC sessions ====="
          vncserver -list || true

          echo ""
          echo "===== Processes ====="
          ps aux | grep -E "Xvnc|kasmvnc" | grep -v grep || true

          echo ""
          echo "===== Listening ports ====="
          ss -lntp || true

          echo ""
          echo "===== VNC logs ====="
          find "$HOME/.vnc" -maxdepth 1 -type f \
            -name "*.log" \
            -print \
            -exec tail -n 100 {} \; || true

          if [ "$READY" -ne 1 ]; then
            echo ""
            echo "=========================================="
            echo " KASMVNC FAILED TO START"
            echo "=========================================="
            exit 1
          fi

          echo ""
          echo "KasmVNC is listening on:"
          echo "127.0.0.1:${KASM_PORT}"


      # ============================================================
      # 9. Verify HTTP endpoint before Cloudflare
      # ============================================================
      - name: Verify KasmVNC Web UI
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking KasmVNC HTTP endpoint..."

          READY=0

          for i in $(seq 1 30); do

            HTTP_CODE="$(
              curl \
                --silent \
                --output /dev/null \
                --write-out "%{http_code}" \
                "http://127.0.0.1:${KASM_PORT}/" \
                || true
            )"

            echo "Attempt $i: HTTP $HTTP_CODE"

            case "$HTTP_CODE" in
              200|301|302|401|403)
                READY=1
                break
                ;;
            esac

            sleep 2
          done

          if [ "$READY" -ne 1 ]; then

            echo ""
            echo "KasmVNC HTTP endpoint is not responding."

            echo ""
            echo "===== Port ====="
            ss -lntp || true

            echo ""
            echo "===== VNC logs ====="
            find "$HOME/.vnc" -type f -name "*.log" \
              -exec tail -n 150 {} \; || true

            exit 1
          fi

          echo ""
          echo "KasmVNC HTTP endpoint is READY."


      # ============================================================
      # 10. Install Cloudflare Tunnel
      # ============================================================
      - name: Install cloudflared
        shell: bash
        run: |
          set -euo pipefail

          echo "Downloading cloudflared..."

          curl -L --fail \
            --retry 5 \
            --retry-delay 2 \
            -o "$HOME/cloudflared" \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64

          chmod +x "$HOME/cloudflared"

          echo ""
          echo "===== cloudflared version ====="
          "$HOME/cloudflared" --version


      # ============================================================
      # 11. Start Cloudflare Quick Tunnel
      # ============================================================
      - name: Start Cloudflare Quick Tunnel
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$HOME/.cloudflared"

          mkdir -p "$HOME/.cloudflared"

          echo "=========================================="
          echo " Starting Cloudflare Quick Tunnel"
          echo "=========================================="

          nohup "$HOME/cloudflared" tunnel \
            --url "http://127.0.0.1:${KASM_PORT}" \
            --no-autoupdate \
            --loglevel info \
            > /tmp/cloudflared.log 2>&1 &

          CLOUDFLARED_PID=$!

          echo "cloudflared PID: $CLOUDFLARED_PID"

          PUBLIC_URL=""

          echo ""
          echo "Waiting for trycloudflare.com URL..."

          for i in $(seq 1 90); do

            if [ -f /tmp/cloudflared.log ]; then

              PUBLIC_URL="$(
                grep -oE \
                  'https://[A-Za-z0-9.-]+\.trycloudflare\.com' \
                  /tmp/cloudflared.log |
                head -n 1 ||
                true
              )"

            fi

            if [ -n "$PUBLIC_URL" ]; then
              break
            fi

            if ! kill -0 "$CLOUDFLARED_PID" 2>/dev/null; then
              echo ""
              echo "cloudflared exited unexpectedly."
              cat /tmp/cloudflared.log || true
              exit 1
            fi

            if [ $((i % 10)) -eq 0 ]; then
              echo ""
              echo "===== cloudflared log ====="
              tail -n 30 /tmp/cloudflared.log || true
            fi

            sleep 2

          done

          if [ -z "$PUBLIC_URL" ]; then

            echo ""
            echo "=========================================="
            echo " CLOUDFLARE TUNNEL FAILED"
            echo "=========================================="

            echo ""
            echo "===== cloudflared ====="
            cat /tmp/cloudflared.log || true

            echo ""
            echo "===== KasmVNC ====="
            vncserver -list || true

            echo ""
            echo "===== Ports ====="
            ss -lntp || true

            exit 1
          fi

          # Verify that Cloudflare can actually reach KasmVNC.
          echo ""
          echo "Cloudflare URL:"
          echo "$PUBLIC_URL"

          echo ""
          echo "Testing public URL..."

          PUBLIC_READY=0

          for i in $(seq 1 30); do

            HTTP_CODE="$(
              curl \
                --silent \
                --location \
                --max-time 15 \
                --output /dev/null \
                --write-out "%{http_code}" \
                "$PUBLIC_URL/" \
                || true
            )"

            echo "Public test $i: HTTP $HTTP_CODE"

            case "$HTTP_CODE" in
              200|301|302|401|403)
                PUBLIC_READY=1
                break
                ;;
            esac

            sleep 2
          done

          if [ "$PUBLIC_READY" -ne 1 ]; then

            echo ""
            echo "WARNING:"
            echo "Cloudflare URL exists, but public HTTP test did not return"
            echo "a normal response yet."
            echo ""
            echo "This can take a few seconds after Quick Tunnel creation."
            echo ""
            tail -n 80 /tmp/cloudflared.log || true

          fi

          echo ""
          echo "=========================================="
          echo "       KASMVNC WEB DESKTOP READY"
          echo "=========================================="
          echo ""
          echo "🌐 Desktop URL:"
          echo "$PUBLIC_URL"
          echo ""
          echo "👤 Username:"
          echo "$VNC_USER"
          echo ""
          echo "🔐 Password:"
          echo "Generated automatically for this run."
          echo ""
          echo "🖥️ Desktop:"
          echo "XFCE"
          echo ""
          echo "📐 Resolution:"
          echo "$DESKTOP_RESOLUTION"
          echo ""
          echo "📋 Clipboard:"
          echo "Enabled"
          echo ""
          echo "🔊 PulseAudio:"
          echo "Enabled locally"
          echo ""
          echo "=========================================="

          {
            echo "## 🖥️ KasmVNC Web Desktop"
            echo ""
            echo "### 🌐 Desktop URL"
            echo ""
            echo "$PUBLIC_URL"
            echo ""
            echo "### 👤 Username"
            echo ""
            echo "\`$VNC_USER\`"
            echo ""
            echo "### 🔐 Password"
            echo ""
            echo "Generated automatically for this workflow run."
            echo ""
            echo "### ⚙️ Configuration"
            echo ""
            echo "- XFCE Desktop"
            echo "- KasmVNC 1.5.0"
            echo "- HTML5 Web Client"
            echo "- Clipboard enabled"
            echo "- 1280×720"
            echo "- Cloudflare Quick Tunnel"
            echo ""
            echo "> Open the URL above in Chrome/Firefox/Edge."
          } >> "$GITHUB_STEP_SUMMARY"


      # ============================================================
      # 12. Keep runner alive
      # ============================================================
      - name: Keep desktop alive
        shell: bash
        run: |
          set -euo pipefail

          echo ""
          echo "=========================================="
          echo " Desktop is running"
          echo "=========================================="

          echo ""
          echo "KasmVNC:"
          vncserver -list || true

          echo ""
          echo "Ports:"
          ss -lntp || true

          echo ""
          echo "Cloudflare:"
          tail -n 20 /tmp/cloudflared.log || true

          echo ""
          echo "Keeping GitHub Runner alive for 6 hours..."

          sleep 21600
