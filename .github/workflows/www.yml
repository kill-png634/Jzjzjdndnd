name: Web Desktop with noVNC & Cloudflare Tunnel

on:
  workflow_dispatch:

jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      STATE_DIR: ${{ github.workspace }}/persisted-state
      HOME_CACHE_KEY: web-desktop-state-v4-${{ runner.os }}

    steps:
      - name: Restore persisted state
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: persisted-state
          key: ${{ env.HOME_CACHE_KEY }}
          restore-keys: |
            web-desktop-state-v4-${{ runner.os }}-

      - name: Restore files into HOME
        run: |
          set -euo pipefail
          mkdir -p "$STATE_DIR/home"
          mkdir -p "$HOME/.config" "$HOME/.local/share" "$HOME/.cache" "$HOME/.vnc" "$HOME/Downloads"

          if [ -d "$STATE_DIR/home" ]; then
            rsync -a "$STATE_DIR/home/" "$HOME/" || true
          fi

      - name: Install required packages
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            xfce4 xfce4-goodies \
            tigervnc-standalone-server \
            novnc websockify \
            dbus-x11 x11-xserver-utils \
            xdg-utils \
            curl jq rsync \
            fonts-dejavu-core

      - name: Configure desktop, VNC and browser fallback
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.vnc"
          mkdir -p "$HOME/.local/bin"
          mkdir -p "$HOME/.local/share/applications"
          mkdir -p "$HOME/.config" "$HOME/.local/share" "$HOME/.cache" "$HOME/Downloads"
          touch "$HOME/.Xresources"
          touch "$HOME/.Xauthority"

          echo "password" | vncpasswd -f > "$HOME/.vnc/passwd"
          chmod 600 "$HOME/.vnc/passwd"

          cat > "$HOME/.vnc/xstartup" <<'EOF'
          #!/bin/sh
          unset SESSION_MANAGER
          unset DBUS_SESSION_BUS_ADDRESS
          touch "$HOME/.Xresources"
          xrdb "$HOME/.Xresources"
          exec dbus-launch --exit-with-session startxfce4
          EOF
          chmod +x "$HOME/.vnc/xstartup"

          cat > "$HOME/.local/bin/browser-fallback" <<'EOF'
          #!/bin/sh
          URL="${1:-https://www.google.com}"

          if command -v epiphany-browser >/dev/null 2>&1; then
              exec epiphany-browser "$URL"
          fi

          if command -v firefox >/dev/null 2>&1; then
              exec firefox "$URL"
          fi

          if command -v chromium >/dev/null 2>&1; then
              exec chromium "$URL"
          fi

          if command -v chromium-browser >/dev/null 2>&1; then
              exec chromium-browser "$URL"
          fi

          if command -v google-chrome >/dev/null 2>&1; then
              exec google-chrome "$URL"
          fi

          echo "No supported browser found."
          exit 1
          EOF
          chmod +x "$HOME/.local/bin/browser-fallback"

          cat > "$HOME/.local/share/applications/browser-fallback.desktop" <<EOF
          [Desktop Entry]
          Name=Web Browser
          Comment=Fallback Web Browser
          Exec=$HOME/.local/bin/browser-fallback %u
          Terminal=false
          Type=Application
          Categories=Network;WebBrowser;
          MimeType=text/html;x-scheme-handler/http;x-scheme-handler/https;
          EOF

          xdg-mime default browser-fallback.desktop x-scheme-handler/http || true
          xdg-mime default browser-fallback.desktop x-scheme-handler/https || true
          xdg-mime default browser-fallback.desktop text/html || true
          xdg-settings set default-web-browser browser-fallback.desktop || true

      - name: Start services and expose with Cloudflare
        run: |
          set -euo pipefail

          mkdir -p "$STATE_DIR/home"

          backup_loop() {
            while true; do
              mkdir -p "$STATE_DIR/home"
              rsync -a \
                --exclude '.cache/mozilla' \
                --exclude '.cache/chromium' \
                --exclude '.cache/google-chrome' \
                --exclude '.cache/epiphany' \
                --exclude '.npm' \
                --exclude '.cargo' \
                "$HOME/" "$STATE_DIR/home/" >/tmp/state-sync.log 2>&1 || true
              sleep 180
            done
          }

          backup_loop &
          BACKUP_PID=$!

          cleanup() {
            set +e
            kill "$BACKUP_PID" >/dev/null 2>&1 || true

            vncserver -kill :1 >/dev/null 2>&1 || true

            mkdir -p "$STATE_DIR/home"
            rsync -a \
              --exclude '.cache/mozilla' \
              --exclude '.cache/chromium' \
              --exclude '.cache/google-chrome' \
              --exclude '.cache/epiphany' \
              --exclude '.npm' \
              --exclude '.cargo' \
              "$HOME/" "$STATE_DIR/home/" >/tmp/final-sync.log 2>&1 || true
          }
          trap cleanup EXIT INT TERM

          vncserver :1 -geometry 1280x720 -depth 24 -localhost yes
          sleep 3

          websockify --web=/usr/share/novnc/ 6080 localhost:5901 > /tmp/websockify.log 2>&1 &
          sleep 2

          curl -L --fail -o cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared

          nohup ./cloudflared tunnel \
            --url http://127.0.0.1:6080 \
            --no-autoupdate \
            --logfile /tmp/cloudflared.log \
            >/tmp/cloudflared.stdout 2>&1 &

          PUBLIC_URL=""
          for i in $(seq 1 60); do
            PUBLIC_URL=$(grep -oE 'https://[-a-z0-9]+\.trycloudflare\.com' /tmp/cloudflared.log | head -n 1 || true)
            if [ -n "$PUBLIC_URL" ]; then
              break
            fi
            sleep 2
          done

          if [ -z "$PUBLIC_URL" ]; then
            echo "Cloudflared failed."
            echo "--- cloudflared.log ---"
            cat /tmp/cloudflared.log || true
            echo "--- cloudflared.stdout ---"
            cat /tmp/cloudflared.stdout || true
            exit 1
          fi

          echo "Desktop URL: $PUBLIC_URL"
          echo "Desktop URL: $PUBLIC_URL" >> "$GITHUB_STEP_SUMMARY"

          # کمی کمتر از timeout تا مرحله‌های save هم برسند
          sleep 21000

      - name: Save final state to cache dir
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$STATE_DIR/home"
          rsync -a \
            --exclude '.cache/mozilla' \
            --exclude '.cache/chromium' \
            --exclude '.cache/google-chrome' \
            --exclude '.cache/epiphany' \
            --exclude '.npm' \
            --exclude '.cargo' \
            "$HOME/" "$STATE_DIR/home/" || true

      - name: Save persisted state cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: persisted-state
          key: ${{ env.HOME_CACHE_KEY }}
