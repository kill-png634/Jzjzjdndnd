name: Lightweight Web Desktop with Openbox + KasmVNC + Cloudflare

on:
  workflow_dispatch:

jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install lightweight desktop
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            openbox \
            xterm \
            dbus-x11 \
            x11-xserver-utils \
            xdg-utils \
            curl \
            wget \
            ca-certificates \
            jq \
            fonts-dejavu-core \
            net-tools \
            iproute2

      - name: Install KasmVNC
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " Installing KasmVNC"
          echo "=========================================="

          ARCH="$(dpkg --print-architecture)"
          . /etc/os-release
          CODENAME="${VERSION_CODENAME:-}"

          echo "Architecture: $ARCH"
          echo "Codename: $CODENAME"

          RELEASE_JSON="$(curl -fsSL https://api.github.com/repos/kasmtech/KasmVNC/releases/latest)"

          PACKAGE_URL="$(
            printf '%s' "$RELEASE_JSON" | jq -r \
              --arg codename "$CODENAME" \
              --arg arch "$ARCH" '
                [ .assets[].browser_download_url
                  | select(test("kasmvncserver_.*" + $codename + ".*_" + $arch + "\\.deb$"; "i"))
                ][0] // empty
              '
          )"

          if [ -z "$PACKAGE_URL" ] || [ "$PACKAGE_URL" = "null" ]; then
            PACKAGE_URL="$(
              printf '%s' "$RELEASE_JSON" | jq -r \
                --arg arch "$ARCH" '
                  [ .assets[].browser_download_url
                    | select(test("kasmvncserver_.*_" + $arch + "\\.deb$"; "i"))
                  ][0] // empty
                '
            )"
          fi

          if [ -z "$PACKAGE_URL" ] || [ "$PACKAGE_URL" = "null" ]; then
            echo "Could not find a matching KasmVNC .deb asset in the latest release."
            echo "Available assets:"
            printf '%s' "$RELEASE_JSON" | jq -r '.assets[].name'
            exit 1
          fi

          echo "Using package: $PACKAGE_URL"

          wget -O /tmp/kasmvnc.deb "$PACKAGE_URL"
          sudo apt-get install -y /tmp/kasmvnc.deb

          echo "KasmVNC installed."

      - name: Configure Openbox and KasmVNC
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.vnc"
          mkdir -p "$HOME/.config/openbox"
          mkdir -p "$HOME/.local/bin"
          mkdir -p "$HOME/.local/share/applications"

          touch "$HOME/.Xresources"

          # VNC password
          printf '%s\n%s\n' "password" "password" | vncpasswd -u "$USER" "$HOME/.vnc/passwd"
          chmod 600 "$HOME/.vnc/passwd"

          # Openbox configuration
          cat > "$HOME/.config/openbox/rc.xml" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <openbox_config xmlns="http://openbox.org/3.4/rc">
            <focus>
              <focusNew>yes</focusNew>
              <followMouse>no</followMouse>
              <focusLast>yes</focusLast>
              <underMouse>no</underMouse>
              <raiseOnFocus>no</raiseOnFocus>
            </focus>
            <desktops>
              <number>1</number>
              <firstdesk>1</firstdesk>
            </desktops>
            <applications>
              <application class="*">
                <decor>yes</decor>
              </application>
            </applications>
          </openbox_config>
          EOF

          # Startup script
          cat > "$HOME/.vnc/xstartup" <<'EOF'
          #!/bin/sh
          unset SESSION_MANAGER
          unset DBUS_SESSION_BUS_ADDRESS

          export XDG_CURRENT_DESKTOP=Openbox
          export XDG_SESSION_DESKTOP=Openbox

          xrdb "$HOME/.Xresources" || true

          if command -v dbus-launch >/dev/null 2>&1; then
              exec dbus-launch --exit-with-session openbox-session
          else
              exec openbox-session
          fi
          EOF

          chmod +x "$HOME/.vnc/xstartup"

          # Browser launcher
          cat > "$HOME/.local/bin/browser-fallback" <<'EOF'
          #!/bin/sh
          URL="${1:-https://www.google.com}"

          if command -v chromium >/dev/null 2>&1; then
            exec chromium \
              --disable-gpu \
              --disable-dev-shm-usage \
              --no-sandbox \
              "$URL"
          fi

          if command -v chromium-browser >/dev/null 2>&1; then
            exec chromium-browser \
              --disable-gpu \
              --disable-dev-shm-usage \
              --no-sandbox \
              "$URL"
          fi

          if command -v firefox >/dev/null 2>&1; then
            exec firefox "$URL"
          fi

          echo "No supported browser found."
          exit 1
          EOF

          chmod +x "$HOME/.local/bin/browser-fallback"

          # Desktop launcher
          cat > "$HOME/.local/share/applications/browser-fallback.desktop" <<EOF
          [Desktop Entry]
          Name=Web Browser
          Comment=Lightweight Web Browser
          Exec=$HOME/.local/bin/browser-fallback %u
          Terminal=false
          Type=Application
          Categories=Network;WebBrowser;
          MimeType=text/html;x-scheme-handler/http;x-scheme-handler/https;
          EOF

          xdg-mime default browser-fallback.desktop x-scheme-handler/http || true
          xdg-mime default browser-fallback.desktop x-scheme-handler/https || true
          xdg-mime default browser-fallback.desktop text/html || true

      - name: Start KasmVNC and Cloudflare
        run: |
          set -euo pipefail

          echo "=========================================="
          echo " Starting lightweight desktop"
          echo "=========================================="

          vncserver -kill :1 >/dev/null 2>&1 || true

          # Start KasmVNC
          vncserver :1 \
            -geometry 1280x720 \
            -depth 24 \
            -localhost yes

          sleep 5

          echo "KasmVNC started."

          WEB_PORT="6901"

          # Wait for the web port to come up
          for i in $(seq 1 30); do
            if ss -lntp 2>/dev/null | grep -q ":${WEB_PORT} "; then
              break
            fi
            sleep 2
          done

          if ! ss -lntp 2>/dev/null | grep -q ":${WEB_PORT} "; then
            echo "Warning: KasmVNC web port ${WEB_PORT} not detected yet."
            ss -lntp || true
          fi

          # Cloudflared
          curl -L --fail \
            -o /tmp/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64

          chmod +x /tmp/cloudflared

          # Start Cloudflare Quick Tunnel
          nohup /tmp/cloudflared tunnel \
            --url "https://127.0.0.1:${WEB_PORT}" \
            --no-tls-verify \
            --no-autoupdate \
            --logfile /tmp/cloudflared.log \
            >/tmp/cloudflared.stdout 2>&1 &

          echo "Waiting for Cloudflare URL..."

          PUBLIC_URL=""

          for i in $(seq 1 90); do
            PUBLIC_URL="$(
              grep -oE 'https://[-a-z0-9]+\.trycloudflare\.com' /tmp/cloudflared.log 2>/dev/null | head -n 1 || true
            )"

            if [ -n "$PUBLIC_URL" ]; then
              break
            fi

            PUBLIC_URL="$(
              grep -oE 'https://[-a-z0-9]+\.trycloudflare\.com' /tmp/cloudflared.stdout 2>/dev/null | head -n 1 || true
            )"

            if [ -n "$PUBLIC_URL" ]; then
              break
            fi

            sleep 2
          done

          if [ -z "$PUBLIC_URL" ]; then
            echo "Cloudflare Tunnel failed."

            echo "========== cloudflared.log =========="
            cat /tmp/cloudflared.log || true

            echo "========== cloudflared.stdout =========="
            cat /tmp/cloudflared.stdout || true

            exit 1
          fi

          echo ""
          echo "=========================================="
          echo " DESKTOP READY"
          echo "=========================================="
          echo ""
          echo "Desktop URL:"
          echo "$PUBLIC_URL"
          echo ""
          echo "Password:"
          echo "password"
          echo ""

          {
            echo "## 🖥️ Lightweight Web Desktop"
            echo ""
            echo "**Desktop URL:** $PUBLIC_URL"
            echo ""
            echo "**Password:** `password`"
            echo ""
            echo "**Web Port:** $WEB_PORT"
          } >> "$GITHUB_STEP_SUMMARY"

          while true; do
            sleep 60

            if ! pgrep -f "cloudflared tunnel" >/dev/null; then
              echo "Cloudflare process stopped."
              exit 1
            fi

            if ! pgrep -f "vncserver" >/dev/null && ! pgrep -f "Xvnc" >/dev/null; then
              echo "VNC process stopped."
              exit 1
            fi
          done
