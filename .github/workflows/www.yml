name: Web Desktop (KasmVNC + Browsers)

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'Session duration in minutes (max 350)'
        required: false
        default: '340'
      password:
        description: 'VNC password'
        required: false
        default: 'kasm1234'

jobs:
  desktop:
    runs-on: ubuntu-22.04
    timeout-minutes: 355

    steps:
      - name: Prepare environment
        run: |
          echo "=== System Info ==="
          uname -a
          df -h /
          sudo apt-get update -y

      - name: Install XFCE desktop
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            xfce4 xfce4-goodies xfce4-terminal \
            dbus-x11 x11-xserver-utils xauth \
            fonts-dejavu fonts-liberation \
            pulseaudio \
            wget curl gnupg ca-certificates apt-transport-https software-properties-common

      - name: Install KasmVNC
        run: |
          KASM_VER="1.3.3"
          KASM_DEB="kasmvncserver_jammy_${KASM_VER}_amd64.deb"
          wget -q "https://github.com/kasmtech/KasmVNC/releases/download/v${KASM_VER}/${KASM_DEB}" -O /tmp/kasmvnc.deb
          sudo apt-get install -y /tmp/kasmvnc.deb
          sudo usermod -aG ssl-cert $USER || true

      - name: Install browsers (Firefox + Chrome + Chromium)
        run: |
          # --- Firefox via Mozilla APT (avoid snap) ---
          sudo install -d -m 0755 /etc/apt/keyrings
          wget -q https://packages.mozilla.org/apt/repo-signing-key.gpg -O- \
            | sudo tee /etc/apt/keyrings/packages.mozilla.org.asc > /dev/null
          echo "deb [signed-by=/etc/apt/keyrings/packages.mozilla.org.asc] https://packages.mozilla.org/apt mozilla main" \
            | sudo tee /etc/apt/sources.list.d/mozilla.list > /dev/null
          printf 'Package: *\nPin: origin packages.mozilla.org\nPin-Priority: 1000\n' \
            | sudo tee /etc/apt/preferences.d/mozilla > /dev/null
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y firefox

          # --- Google Chrome ---
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb -O /tmp/chrome.deb
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y /tmp/chrome.deb

          # --- Chromium (fallback, may fail on some runners) ---
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y chromium-browser || true

      - name: Configure KasmVNC session
        run: |
          mkdir -p ~/.vnc
          cat > ~/.vnc/xstartup <<'EOS'
          #!/bin/bash
          unset SESSION_MANAGER
          unset DBUS_SESSION_BUS_ADDRESS
          export XDG_SESSION_TYPE=x11
          export XDG_CURRENT_DESKTOP=XFCE
          dbus-launch --exit-with-session startxfce4 &
          EOS
          chmod +x ~/.vnc/xstartup

          cat > ~/.vnc/kasmvnc.yaml <<'YAML'
          network:
            protocol: http
            interface: 0.0.0.0
            websocket_port: 6901
          desktop:
            resolution:
              width: 1440
              height: 900
            allow_resize: true
          runtime_configuration:
            allow_client_to_override_kasm_server_settings: true
          logging:
            log_writer_name: all
            log_dest: logfile
            level: 30
          YAML

          # set VNC password (non-interactive)
          PW='${{ github.event.inputs.password }}'
          printf '%s\n%s\n' "$PW" "$PW" | vncpasswd -u kasm -w -r owner || true

      - name: Install cloudflared
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -O /tmp/cf.deb
          sudo dpkg -i /tmp/cf.deb

      - name: Start KasmVNC server
        run: |
          vncserver :1 -select-de xfce -disableBasicAuth -geometry 1440x900 -depth 24 -websocketPort 6901 &
          sleep 8
          echo "=== Listening ports ==="
          ss -tlnp | grep -E '5901|6901' || true
          echo "=== VNC log tail ==="
          tail -n 40 ~/.vnc/*.log 2>/dev/null || true

      - name: Start Cloudflare tunnel and print URL
        run: |
          nohup cloudflared tunnel --no-autoupdate --url http://localhost:6901 > /tmp/cf.log 2>&1 &
          echo "Waiting for tunnel URL..."
          URL=""
          for i in $(seq 1 30); do
            URL=$(grep -Eo 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' /tmp/cf.log | head -n1)
            [ -n "$URL" ] && break
            sleep 2
          done
          if [ -z "$URL" ]; then
            echo "❌ Tunnel URL not found. Log:"
            cat /tmp/cf.log
            exit 1
          fi
          echo ""
          echo "================================================"
          echo " 🖥  Web Desktop is ready!"
          echo " 🔗 URL:      $URL"
          echo " 👤 Password: ${{ github.event.inputs.password }}"
          echo "================================================"
          echo "DESKTOP_URL=$URL" >> $GITHUB_ENV
          echo "### 🖥 Web Desktop"        >> $GITHUB_STEP_SUMMARY
          echo "**URL:** $URL"              >> $GITHUB_STEP_SUMMARY
          echo "**Password:** ${{ github.event.inputs.password }}" >> $GITHUB_STEP_SUMMARY

      - name: Keep session alive
        run: |
          MIN=${{ github.event.inputs.duration }}
          MIN=${MIN:-340}
          if [ "$MIN" -gt 350 ]; then MIN=350; fi
          END=$(( $(date +%s) + MIN*60 ))
          echo "Session will end at: $(date -d @$END)"
          while [ $(date +%s) -lt $END ]; do
            if ! pgrep -x cloudflared > /dev/null; then
              echo "cloudflared died, log:"; tail -n 50 /tmp/cf.log; exit 1
            fi
            sleep 60
          done
          echo "Session finished."
