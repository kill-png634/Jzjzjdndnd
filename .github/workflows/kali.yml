name: Kali Web Desktop with Selkies & Cloudflare Tunnel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    env:
      DESKTOP_USER: kali
      DESKTOP_PASSWORD: ${{ secrets.SELKIES_PASSWORD }}

    steps:
      - name: Validate required secret
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DESKTOP_PASSWORD}" ]; then
            echo "::error::Secret SELKIES_PASSWORD is missing."
            echo "Create it at: Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Prepare wallpaper + startup customizations
        shell: bash
        run: |
          set -euo pipefail

          # پوشه ای که به /config کانتینر mount می‌شه
          mkdir -p ./kali-config/custom-cont-init.d
          mkdir -p ./kali-config/Pictures

          # ------------------------------------------------------------
          # اسکریپت init که موقع بالا اومدن کانتینر اجرا می‌شه:
          #   * والپیپر رسمی کالی رو ست می‌کنه
          #   * صدا رو مطمئن می‌شه که فعاله (pulseaudio)
          #   * پرامپت‌های Permission رو خفه می‌کنه تا باگ fullscreen پیش نیاد
          # ------------------------------------------------------------
          cat > ./kali-config/custom-cont-init.d/10-kali-tweaks.sh <<'INIT_EOF'
          #!/usr/bin/with-contenv bash
          set -e

          echo "[kali-tweaks] applying Kali wallpaper + audio + permission fixes..."

          # ---------- 1) نصب پکیج والپیپرها اگه نبود ----------
          if ! dpkg -s kali-wallpapers-2024 >/dev/null 2>&1 \
             && ! dpkg -s kali-wallpapers-all >/dev/null 2>&1; then
            apt-get update -qq || true
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              kali-wallpapers-all pulseaudio pulseaudio-utils || true
          fi

          # ---------- 2) پیدا کردن یک والپیپر قشنگ ----------
          WALL=""
          for candidate in \
            /usr/share/backgrounds/kali/kali-layers.jpg \
            /usr/share/backgrounds/kali/kali-16x9.png \
            /usr/share/backgrounds/kali-16x9/default \
            /usr/share/backgrounds/kali/default; do
            if [ -e "$candidate" ]; then
              WALL="$candidate"
              break
            fi
          done
          if [ -z "$WALL" ]; then
            WALL="$(find /usr/share/backgrounds -type f \( -iname '*.jpg' -o -iname '*.png' \) 2>/dev/null | head -n 1 || true)"
          fi
          echo "[kali-tweaks] wallpaper = ${WALL:-<none-found>}"

          # ---------- 3) اعمال والپیپر روی KDE Plasma ----------
          # Plasma از یک فایل config استفاده می‌کنه که ما ازش template داریم
          if [ -n "$WALL" ]; then
            mkdir -p /config/.config
            PLASMA_CFG=/config/.config/plasma-org.kde.plasma.desktop-appletsrc
            cat > "$PLASMA_CFG" <<PLASMA_EOF
          [Containments][1][Wallpaper][org.kde.image][General]
          Image=file://${WALL}
          FillMode=2
          PLASMA_EOF
            chown -R abc:abc /config/.config 2>/dev/null || true
          fi

          # ---------- 4) اطمینان از اجرای PulseAudio برای صدا ----------
          mkdir -p /config/.config/pulse
          # به Selkies میگیم از output.monitor بگیره (پیش‌فرض خودشم همینه)
          echo "[kali-tweaks] audio device = output.monitor"

          # ---------- 5) نصب یک user policy برای Chromium/Firefox ----------
          # این باعث می‌شه مرورگر داخل دسکتاپ اصلاً برای mic/camera prompt نده
          # (ربطی به مرورگر client نداره؛ صرفاً UX بهتر داخل دسکتاپه)
          mkdir -p /etc/chromium/policies/managed
          cat > /etc/chromium/policies/managed/no-permission-prompts.json <<'POL_EOF'
          {
            "AudioCaptureAllowed": false,
            "VideoCaptureAllowed": false,
            "DefaultNotificationsSetting": 2
          }
          POL_EOF

          echo "[kali-tweaks] done."
          INIT_EOF

          chmod +x ./kali-config/custom-cont-init.d/10-kali-tweaks.sh

      - name: Pull Kali Selkies image
        shell: bash
        run: |
          set -euo pipefail
          docker pull lscr.io/linuxserver/kali-linux:latest

      - name: Start Kali Selkies desktop
        shell: bash
        run: |
          set -euo pipefail

          docker run -d \
            --name selkies-desktop \
            --shm-size=2gb \
            -p 127.0.0.1:3000:3000 \
            -e PUID=1000 \
            -e PGID=1000 \
            -e TZ=Etc/UTC \
            -e CUSTOM_USER="${DESKTOP_USER}" \
            -e PASSWORD="${DESKTOP_PASSWORD}" \
            -e TITLE="Kali Selkies Desktop" \
            -e SELKIES_UI_TITLE="Kali Desktop" \
            -e SELKIES_USE_CPU="true" \
            -e SELKIES_ENCODER="x264enc,jpeg" \
            -e SELKIES_FRAMERATE="30" \
            -e SELKIES_MANUAL_WIDTH="1280" \
            -e SELKIES_MANUAL_HEIGHT="720" \
            -e SELKIES_IS_MANUAL_RESOLUTION_MODE="true" \
            -e SELKIES_AUDIO_ENABLED="true" \
            -e SELKIES_AUDIO_BITRATE="192000" \
            -e SELKIES_MICROPHONE_ENABLED="false|locked" \
            -e SELKIES_GAMEPAD_ENABLED="false|locked" \
            -e SELKIES_UI_SIDEBAR_SHOW_FULLSCREEN="true" \
            -v "$(pwd)/kali-config":/config \
            lscr.io/linuxserver/kali-linux:latest

      - name: Local Selkies readiness and HTTP tests
        shell: bash
        run: |
          set -euo pipefail

          echo "Waiting for Selkies HTTP service..."
          OK=0
          for i in $(seq 1 120); do
            if curl --fail --silent --show-error \
              --user "${DESKTOP_USER}:${DESKTOP_PASSWORD}" \
              --max-time 10 \
              http://127.0.0.1:3000/ \
              -o /tmp/selkies.html; then
              OK=1
              break
            fi
            if ! docker ps --format '{{.Names}}' | grep -qx 'selkies-desktop'; then
              echo "::error::Selkies container stopped unexpectedly."
              docker logs selkies-desktop || true
              exit 1
            fi
            sleep 2
          done

          if [ "${OK}" -ne 1 ]; then
            echo "::error::Selkies HTTP service never responded successfully."
            docker logs --tail 200 selkies-desktop || true
            exit 1
          fi

          test -s /tmp/selkies.html
          if grep -qE 'id="app"|manifest\.json|apple-touch-icon|assets/index-.*\.js' /tmp/selkies.html; then
            echo "Local Selkies HTTP test passed (SPA shell detected)."
          else
            echo "::error::The service replied, but the page does not look like the Selkies web client."
            head -n 80 /tmp/selkies.html || true
            exit 1
          fi

      - name: Install cloudflared
        shell: bash
        run: |
          set -euo pipefail
          sudo curl --fail --location --retry 3 \
            --output /usr/local/bin/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          sudo chmod +x /usr/local/bin/cloudflared
          cloudflared --version

      - name: Start Cloudflare tunnel
        shell: bash
        run: |
          set -euo pipefail

          nohup cloudflared tunnel \
            --url http://127.0.0.1:3000 \
            --protocol http2 \
            --no-autoupdate \
            --loglevel info \
            --logfile /tmp/cloudflared.log \
            >/tmp/cloudflared.stdout 2>&1 &

          PUBLIC_URL=""
          for i in $(seq 1 90); do
            PUBLIC_URL="$(
              grep -hEo 'https://[-a-z0-9]+\.trycloudflare\.com' \
                /tmp/cloudflared.log /tmp/cloudflared.stdout 2>/dev/null \
                | head -n 1 || true
            )"
            if [ -n "${PUBLIC_URL}" ]; then
              break
            fi
            sleep 2
          done

          if [ -z "${PUBLIC_URL}" ]; then
            echo "::error::Cloudflare Quick Tunnel did not return a public URL."
            cat /tmp/cloudflared.log || true
            cat /tmp/cloudflared.stdout || true
            exit 1
          fi
          echo "PUBLIC_URL=${PUBLIC_URL}" >> "${GITHUB_ENV}"

      - name: Public tunnel end-to-end test
        shell: bash
        run: |
          set -euo pipefail
          echo "Testing the public Cloudflare URL..."

          OK=0
          for i in $(seq 1 30); do
            if curl --fail --silent --show-error \
              --location \
              --user "${DESKTOP_USER}:${DESKTOP_PASSWORD}" \
              --max-time 20 \
              "${PUBLIC_URL}" \
              -o /tmp/public-selkies.html; then
              OK=1
              break
            fi
            sleep 2
          done

          if [ "${OK}" -ne 1 ]; then
            echo "::error::Public Cloudflare URL never responded successfully."
            exit 1
          fi

          test -s /tmp/public-selkies.html
          if grep -qE 'id="app"|manifest\.json|apple-touch-icon|assets/index-.*\.js' /tmp/public-selkies.html; then
            echo "Public Cloudflare tunnel HTTP test passed (SPA shell detected)."
          else
            echo "::error::Public URL responded but did not serve the Selkies web client."
            head -n 80 /tmp/public-selkies.html || true
            exit 1
          fi

      - name: Publish desktop link
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## ✅ Kali Selkies Desktop is ready"
            echo
            echo "- Desktop URL: ${PUBLIC_URL}"
            echo "- Username: \`${DESKTOP_USER}\`"
            echo "- Password: value of the \`SELKIES_PASSWORD\` Actions secret"
            echo "- Resolution: 1280×720"
            echo "- Encoder: CPU / x264"
            echo "- Audio: ✅ Enabled (server-to-client)"
            echo "- Microphone: 🚫 Disabled (prevents fullscreen-drop bug)"
            echo
            echo "> The link works only while this GitHub Actions job remains running."
          } >> "${GITHUB_STEP_SUMMARY}"

          echo "Desktop URL: ${PUBLIC_URL}"
          echo "Username: ${DESKTOP_USER}"
          echo "Password: use the SELKIES_PASSWORD secret value."

      - name: Keep desktop alive
        shell: bash
        run: |
          set -euo pipefail
          while true; do
            if ! docker ps --format '{{.Names}}' | grep -qx 'selkies-desktop'; then
              echo "::error::Selkies container stopped."
              docker logs selkies-desktop || true
              exit 1
            fi
            sleep 60
          done
