name: Web Desktop with noVNC & Cloudflare Tunnel

on:
  workflow_dispatch:

jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install required packages
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            xfce4 xfce4-goodies \
            tigervnc-standalone-server \
            novnc websockify \
            dbus-x11 x11-xserver-utils \
            jq curl

      - name: Configure VNC and desktop
        run: |
          set -euo pipefail

          mkdir -p ~/.vnc
          touch ~/.Xresources

          echo "password" | vncpasswd -f > ~/.vnc/passwd
          chmod 600 ~/.vnc/passwd

          cat > ~/.vnc/xstartup <<'EOF'
          #!/bin/sh
          unset SESSION_MANAGER
          unset DBUS_SESSION_BUS_ADDRESS
          touch "$HOME/.Xresources"
          xrdb "$HOME/.Xresources"
          exec dbus-launch --exit-with-session startxfce4
          EOF
          chmod +x ~/.vnc/xstartup

      - name: Start services and keep alive
        run: |
          set -euo pipefail

          # VNC on :1 -> localhost:5901
          vncserver :1 -geometry 1280x720 -depth 24 -localhost yes
          sleep 3

          # noVNC proxy
          websockify --web=/usr/share/novnc/ 6080 localhost:5901 > /tmp/websockify.log 2>&1 &
          sleep 2

          # Cloudflared
          curl -L --fail -o cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared

          nohup ./cloudflared tunnel \
            --url http://127.0.0.1:6080 \
            --no-autoupdate \
            --logfile /tmp/cloudflared.log \
            >/tmp/cloudflared.stdout 2>&1 &

          # Wait for public URL
          PUBLIC_URL=""
          for i in $(seq 1 60); do
            PUBLIC_URL=$(grep -oE 'https://[-a-z0-9]+\.trycloudflare\.com' /tmp/cloudflared.log | head -n 1 || true)
            if [ -n "$PUBLIC_URL" ]; then
              break
            fi
            sleep 2
          done

          if [ -z "$PUBLIC_URL" ]; then
            echo "Cloudflared failed. Logs:"
            echo "--- cloudflared.log ---"
            cat /tmp/cloudflared.log || true
            echo "--- cloudflared.stdout ---"
            cat /tmp/cloudflared.stdout || true
            exit 1
          fi

          echo "Desktop URL: $PUBLIC_URL"
          echo "Desktop URL: $PUBLIC_URL" >> "$GITHUB_STEP_SUMMARY"

          # Keep job alive
          sleep 21600
